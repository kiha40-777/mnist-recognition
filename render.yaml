services:
  - type: web
    name: backend
    env: python
    rootDir: backend             # ← backend/ をビルド
    pythonVersion: 3.12.3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

  - type: static
    name: frontend
    rootDir: frontend            # ← frontend/ をビルド
    buildCommand: |
      npm ci
      npm run generate
    staticPublishPath: .output/public
