services:
  - type: web
    name: ai-digit-backend                 # Render 上で表示されるサービス名
    rootDir: backend                       # ★ backend ディレクトリを基準にビルド
    env: python
    pythonVersion: 3.12.3                  # 3.13 未対応パッケージ回避
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: >
      uvicorn app.main:app
      --host 0.0.0.0 --port $PORT
    autoDeploy: true                       # main ブランチ push ごとに自動デプロイ
    envVars:
      - key: PYTHONUNBUFFERED              # ログをリアルタイムで表示
        value: "1"